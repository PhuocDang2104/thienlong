name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: thienlong
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: thienlong_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U thienlong -d thienlong_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://thienlong:local-development-only@127.0.0.1:55432/thienlong_test?connect_timeout=5
      TEST_DATABASE_URL: postgresql+psycopg://thienlong:local-development-only@127.0.0.1:55432/thienlong_test?connect_timeout=5
      REDIS_URL: redis://localhost:56379/0
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: apps/api
      - run: alembic upgrade head
        working-directory: apps/api
      - run: docker build -t thienlong-api:ci apps/api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
          NEXT_PUBLIC_APP_URL: https://event.example.com

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f deploy/docker-compose.yml config --quiet
        env:
          BACKEND_ENV_FILE: ../.env.example
      - run: docker compose --env-file .env.example -f deploy/docker-compose.managed.yml config --quiet
        env:
          BACKEND_ENV_FILE: ../.env.example
      - run: docker run --rm -v "$PWD/deploy/caddy.thienlong.caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
